function NavPalette({ questions, answers, flagged, currentIndex, mode, submitted, onJump }){
  const [collapsed, setCollapsed] = useState(false);
  const statusOf = (q, i) => {
    const answered = answers[q.id] !== undefined;
    const isFlagged = flagged.includes(q.id);
    if(mode === "study" && answered){
      return answers[q.id] === q.correctOption ? "correct" : "incorrect";
    }
    if(isFlagged) return "flagged";
    if(answered) return "answered";
    return "unanswered";
  };
  const styles = {
    unanswered: { border:"1px solid var(--rule)", color:"var(--ink-soft)" },
    answered: { background:"var(--ink)", color:"var(--paper)" },
    flagged: { background:"var(--flag-soft)", color:"var(--flag)", border:"1px solid var(--flag)" },
    correct: { background:"var(--correct-soft)", color:"var(--correct)" },
    incorrect: { background:"var(--wrong-soft)", color:"var(--wrong)" }
  };
  return (
    <div className="card rounded-2xl p-4">
      <button onClick={()=>setCollapsed(v=>!v)} className="w-full flex items-center justify-between mb-3">
        <span className="text-xs font-semibold uppercase tracking-wide" style={{ color:"var(--ink-soft)" }}>Questions</span>
        <Icon name={collapsed ? "chevron-down" : "chevron-up"} size={14} className="transition" style={{ color:"var(--ink-soft)" }} />
      </button>
      <div className="grid transition-all duration-300 ease-in-out" style={{ gridTemplateRows: collapsed ? "0fr" : "1fr", opacity: collapsed ? 0 : 1 }}>
        <div className="overflow-hidden">
          <div className="grid grid-cols-6 lg:grid-cols-5 gap-1.5 max-h-[320px] lg:max-h-[420px] overflow-y-auto scrollthin pr-1">
            {questions.map((q,i)=>(
              <button key={q.id} onClick={()=>onJump(i)}
                className="aspect-square rounded-lg text-[12px] font-semibold flex items-center justify-center transition relative"
                style={{ ...styles[statusOf(q,i)], ...(i===currentIndex ? { boxShadow:"0 0 0 2px var(--gold)" } : {}) }}>
                {i+1}
              </button>
            ))}
          </div>
          <div className="mt-4 space-y-1.5 text-[11px]" style={{ color:"var(--ink-soft)" }}>
            <div className="flex items-center gap-2"><span className="w-3 h-3 rounded" style={{ border:"1px solid var(--rule)" }}></span>Unanswered</div>
            <div className="flex items-center gap-2"><span className="w-3 h-3 rounded" style={{ background:"var(--ink)" }}></span>Answered</div>
            <div className="flex items-center gap-2"><span className="w-3 h-3 rounded" style={{ background:"var(--flag-soft)", border:"1px solid var(--flag)" }}></span>Flagged</div>
            {mode==="study" && <div className="flex items-center gap-2"><span className="w-3 h-3 rounded" style={{ background:"var(--correct-soft)" }}></span>Correct / <span className="w-3 h-3 rounded inline-block" style={{ background:"var(--wrong-soft)" }}></span> Incorrect</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

function ExamScreen({ state, setState, push, onFinish }){
  const test = state.activeTest;
  const [confirmFinish, setConfirmFinish] = useState(false);
  const q = test.questions[test.currentIndex];
  const selected = test.answers[q.id];
  const tickRef = useRef(0);

  // Timer
  useEffect(()=>{
    const interval = setInterval(()=>{
      setState(s=>{
        if(!s.activeTest || s.activeTest.status !== "IN_PROGRESS") return s;
        const t = s.activeTest;
        if(t.mode === "exam"){
          const remaining = t.remainingSeconds - 1;
          if(remaining <= 0){
            return { ...s, activeTest: { ...t, remainingSeconds: 0 } };
          }
          return { ...s, activeTest: { ...t, remainingSeconds: remaining } };
        }else{
          return { ...s, activeTest: { ...t, elapsedSeconds: (t.elapsedSeconds||0) + 1 } };
        }
      });
      tickRef.current += 1;
      if(tickRef.current % 5 === 0) push("Saved just now", { tone:"save", duration:1200 });
    }, 1000);
    return ()=>clearInterval(interval);
  }, []);

  useEffect(()=>{
    if(test.mode === "exam" && test.remainingSeconds === 0){
      onFinish();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [test.remainingSeconds]);

  const updateTest = (patch) => setState(s=>({ ...s, activeTest: { ...s.activeTest, ...patch } }));

  const selectOption = (label) => {
    if(test.mode === "study" && selected !== undefined) return; // lock after answering in study mode
    updateTest({ answers: { ...test.answers, [q.id]: label } });
  };
  const toggleFlag = () => {
    const has = test.flagged.includes(q.id);
    updateTest({ flagged: has ? test.flagged.filter(x=>x!==q.id) : [...test.flagged, q.id] });
  };
  const goto = (i) => { if(i>=0 && i<test.questions.length) updateTest({ currentIndex: i }); };

  const answeredCount = Object.keys(test.answers).length;
  const timeLabel = test.mode === "exam" ? fmtTime(test.remainingSeconds) : fmtTime(test.elapsedSeconds || 0);
  const timeCritical = test.mode === "exam" && test.remainingSeconds <= 60;

  return (
    <div className="max-w-6xl mx-auto px-4 py-6 fade-up">
      {/* Top bar */}
      <div className="card rounded-2xl px-5 py-3.5 flex items-center justify-between flex-wrap gap-3 mb-5">
        <div className="flex items-center gap-3">
          <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full" style={{ background: test.mode==="exam" ? "var(--flag-soft)":"var(--correct-soft)", color: test.mode==="exam" ? "var(--flag)":"var(--correct)" }}>
            {test.mode === "exam" ? "Exam mode" : "Study mode"}
          </span>
          <span className="text-sm font-medium" style={{ color:"var(--ink-soft)" }}>Question {test.currentIndex+1} of {test.questions.length}</span>
          <span className="hidden sm:inline text-xs" style={{ color:"var(--ink-soft)" }}>· {answeredCount} answered</span>
        </div>
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-1.5 mono text-sm font-semibold px-3 py-1.5 rounded-lg" style={{ color: timeCritical ? "var(--wrong)" : "var(--ink)", background:"var(--paper)" }}>
            <Icon name={test.mode==="exam"?"timer":"clock"} size={14} />
            {timeLabel}
          </div>
          <button onClick={()=>setConfirmFinish(true)} className="text-xs font-semibold px-3.5 py-1.5 rounded-full" style={{ background:"var(--wrong)", color:"#fff" }}>
            Finish
          </button>
        </div>
      </div>

      <div className="grid lg:grid-cols-[1fr_260px] gap-5">
        <div>
          <div className="card rounded-2xl p-6 sm:p-7">
            <div className="flex items-center gap-2 mb-4 flex-wrap">
              <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full" style={{ background:"var(--paper)", color:"var(--ink-soft)", border:"1px solid var(--rule)" }}>{q.subject}</span>
              <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full" style={{ background:"var(--paper)", color:"var(--ink-soft)", border:"1px solid var(--rule)" }}>{q.year}</span>
              {q.section && <span className="text-[11px]" style={{ color:"var(--ink-soft)" }}>{q.section}</span>}
            </div>

            {q.passage && (
              <div className="rounded-xl p-4 mb-5 text-[14.5px] leading-relaxed" style={{ background:"var(--paper)", border:"1px solid var(--rule)", color:"var(--ink-soft)" }}>
                <div className="text-[10.5px] font-semibold uppercase tracking-wide mb-1.5" style={{ color:"var(--gold)" }}>Reading passage</div>
                <MathText text={q.passage} />
              </div>
            )}

            <PageImageViewer question={q} bank={state.bank} />

            <div className="serif text-[19px] leading-relaxed mb-6">
              <MathText text={q.questionText} />
            </div>

            <div className="space-y-2.5">
              {q.options.map(opt=>{
                const isSelected = selected === opt.label;
                const isCorrectAns = opt.label === q.correctOption;
                let style = { border:"1px solid var(--rule)" };
                let icon = null;
                if(test.mode === "study" && selected !== undefined){
                  if(isCorrectAns){ style = { background:"var(--correct-soft)", border:"1px solid var(--correct)" }; icon="check-circle-2"; }
                  else if(isSelected){ style = { background:"var(--wrong-soft)", border:"1px solid var(--wrong)" }; icon="x-circle"; }
                }else if(isSelected){
                  style = { background:"var(--gold-soft)", border:"1.5px solid var(--gold)" };
                }
                return (
                  <button key={opt.label} onClick={()=>selectOption(opt.label)}
                    className="w-full text-left rounded-xl px-4 py-3.5 flex items-start gap-3 transition hover:opacity-90"
                    style={style}>
                    <span className="mono text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center shrink-0" style={{ background:"var(--paper)", border:"1px solid var(--rule)" }}>{opt.label}</span>
                    <span className="text-[14.5px] leading-snug pt-0.5 flex-1"><MathText text={opt.text} /></span>
                    {icon && <Icon name={icon} size={17} className="mt-0.5 shrink-0" style={{ color: icon==="check-circle-2" ? "var(--correct)" : "var(--wrong)" }} />}
                  </button>
                );
              })}
            </div>

            {test.mode === "study" && selected !== undefined && (
              <details className="mt-5 rounded-xl overflow-hidden" style={{ border:"1px solid var(--rule)" }} open>
                <summary className="px-4 py-3 text-sm font-semibold cursor-pointer flex items-center gap-2" style={{ background:"var(--paper)" }}>
                  <Icon name="lightbulb" size={14} /> Explanation
                </summary>
                <div className="px-4 py-3.5 text-[14px] leading-relaxed" style={{ color:"var(--ink-soft)" }}>
                  <MathText text={q.explanation || "No explanation provided."} />
                </div>
              </details>
            )}
          </div>

          <div className="flex items-center justify-between mt-4 gap-2">
            <button onClick={()=>goto(test.currentIndex-1)} disabled={test.currentIndex===0}
              className="px-4 py-2.5 rounded-xl text-sm font-medium flex items-center gap-1.5 disabled:opacity-30" style={{ border:"1px solid var(--rule)" }}>
              <Icon name="chevron-left" size={15} /> Previous
            </button>
            <button onClick={toggleFlag}
              className="px-4 py-2.5 rounded-xl text-sm font-medium flex items-center gap-1.5"
              style={ test.flagged.includes(q.id) ? { background:"var(--flag-soft)", color:"var(--flag)" } : { border:"1px solid var(--rule)" } }>
              <Icon name="flag" size={14} /> {test.flagged.includes(q.id) ? "Flagged" : "Flag for review"}
            </button>
            <button onClick={()=>goto(test.currentIndex+1)} disabled={test.currentIndex===test.questions.length-1}
              className="px-4 py-2.5 rounded-xl text-sm font-medium flex items-center gap-1.5 disabled:opacity-30" style={{ background:"var(--ink)", color:"var(--paper)" }}>
              Next <Icon name="chevron-right" size={15} />
            </button>
          </div>
        </div>

        <div>
          <NavPalette questions={test.questions} answers={test.answers} flagged={test.flagged} currentIndex={test.currentIndex} mode={test.mode} onJump={goto} />
        </div>
      </div>

      {confirmFinish && (
        <Modal onClose={()=>setConfirmFinish(false)}>
          <div className="p-6 text-center">
            <div className="w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-4" style={{ background:"var(--wrong-soft)", color:"var(--wrong)" }}>
              <Icon name="flag-triangle-right" size={20} />
            </div>
            <h3 className="serif text-lg font-semibold mb-1.5">Submit test?</h3>
            <p className="text-sm mb-5" style={{ color:"var(--ink-soft)" }}>
              You've answered {answeredCount} of {test.questions.length} questions. This can't be undone.
            </p>
            <div className="flex gap-2">
              <button onClick={()=>setConfirmFinish(false)} className="flex-1 py-2.5 rounded-lg text-sm font-medium" style={{ border:"1px solid var(--rule)" }}>Keep going</button>
              <button onClick={onFinish} className="flex-1 py-2.5 rounded-lg text-sm font-semibold" style={{ background:"var(--wrong)", color:"#fff" }}>Submit</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================== SCREEN 5: RESULTS ============================== */

function ScoreRing({ pct, size=140 }){
  const r = (size-14)/2, c = 2*Math.PI*r;
  const grade = gradeFor(pct);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--rule)" strokeWidth="10" />
      <circle className="progress-ring" cx={size/2} cy={size/2} r={r} fill="none" stroke={grade.tone} strokeWidth="10" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c - (pct/100)*c} transform={`rotate(-90 ${size/2} ${size/2})`} />
      <text x="50%" y="47%" textAnchor="middle" className="serif" style={{ fontSize: size*0.22, fontWeight:700, fill:"var(--ink)" }}>{Math.round(pct)}%</text>
      <text x="50%" y="64%" textAnchor="middle" style={{ fontSize: size*0.09, fill:"var(--ink-soft)" }}>Grade {grade.label}</text>
    </svg>
  );
}

function BreakdownBars({ title, groups }){
  return (
    <div className="card rounded-2xl p-5">
      <div className="text-xs font-semibold uppercase tracking-wide mb-3" style={{ color:"var(--ink-soft)" }}>{title}</div>
      <div className="space-y-3">
        {groups.map(g=>(
          <div key={g.name}>
            <div className="flex justify-between text-[12.5px] mb-1">
              <span className="font-medium">{g.name}</span>
              <span style={{ color:"var(--ink-soft)" }}>{g.correct}/{g.total} · {Math.round(g.pct)}%</span>
            </div>
            <div className="h-2 rounded-full overflow-hidden" style={{ background:"var(--rule)" }}>
              <div className="h-full rounded-full" style={{ width:`${g.pct}%`, background: g.pct>=70?"var(--correct)":g.pct>=40?"var(--gold)":"var(--wrong)" }}></div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ResultsScreen({ state, setState, result, push, onExit }){
  const [tab, setTab] = useState("all");
  const { questions, answers, mode, elapsedTotal } = result;

  const graded = questions.map((q,i)=>({
    ...q, number: i+1, selected: answers[q.id], correct: answers[q.id] === q.correctOption, answered: answers[q.id] !== undefined
  }));
  const numCorrect = graded.filter(g=>g.correct).length;
  const numIncorrect = graded.filter(g=>g.answered && !g.correct).length;
  const numUnanswered = graded.filter(g=>!g.answered).length;
  const pct = questions.length ? (numCorrect/questions.length*100) : 0;

  const bySubject = useMemo(()=>{
    const map = {};
    graded.forEach(g=>{ (map[g.subject] ||= []).push(g); });
    return Object.entries(map).map(([name, arr])=>({ name, total: arr.length, correct: arr.filter(x=>x.correct).length, pct: arr.length ? arr.filter(x=>x.correct).length/arr.length*100 : 0 }));
  }, [graded]);
  const byYear = useMemo(()=>{
    const map = {};
    graded.forEach(g=>{ (map[g.year] ||= []).push(g); });
    return Object.entries(map).sort().map(([name, arr])=>({ name, total: arr.length, correct: arr.filter(x=>x.correct).length, pct: arr.length ? arr.filter(x=>x.correct).length/arr.length*100 : 0 }));
  }, [graded]);

  const filtered = graded.filter(g => tab==="all" ? true : tab==="incorrect" ? (g.answered && !g.correct) : result.flagged.includes(g.id));

  const retake = () => {
    const shuffled = shuffle(questions);
    setState(s=>({ ...s, activeTest: {
      id: uid(), status:"IN_PROGRESS", mode, config: result.config, questions: shuffled, answers:{}, flagged:[],
      currentIndex:0, remainingSeconds: mode==="exam" ? (result.config.timerMins*60) : 0, elapsedSeconds:0, startedAt: Date.now(), submittedAt:null
    }}));
  };
  const newConfig = () => { onExit(); setState(s=>({ ...s, activeTest: null })); };
  const newUpload = () => { onExit(); setState(s=>({ ...s, activeTest: null, bank: null })); };

  return (
    <div className="max-w-4xl mx-auto px-5 py-10 fade-up">
      <div className="card rounded-2xl p-7 flex flex-col sm:flex-row items-center gap-8 mb-6">
        <ScoreRing pct={pct} />
        <div className="flex-1 grid grid-cols-3 gap-4 w-full">
          {[
            ["Correct", numCorrect, "var(--correct)"],
            ["Incorrect", numIncorrect, "var(--wrong)"],
            ["Unanswered", numUnanswered, "var(--ink-soft)"]
          ].map(([label,val,color])=>(
            <div key={label} className="text-center">
              <div className="serif text-2xl font-semibold" style={{ color }}>{val}</div>
              <div className="text-[11px] mt-0.5" style={{ color:"var(--ink-soft)" }}>{label}</div>
            </div>
          ))}
          <div className="col-span-3 pt-3 mt-1 flex items-center justify-center gap-1.5 text-xs" style={{ borderTop:"1px solid var(--rule)", color:"var(--ink-soft)" }}>
            <Icon name="clock" size={12} /> Time taken: {fmtTime(elapsedTotal)}
          </div>
        </div>
      </div>

      <div className="grid sm:grid-cols-2 gap-4 mb-6">
        <BreakdownBars title="Accuracy by subject" groups={bySubject} />
        <BreakdownBars title="Accuracy by year" groups={byYear} />
      </div>

      <div className="card rounded-2xl p-5">
        <div className="flex gap-1.5 mb-4">
          {[["all","All questions"],["incorrect","Incorrect only"],["flagged","Flagged"]].map(([id,label])=>(
            <button key={id} onClick={()=>setTab(id)} className="px-3.5 py-1.5 rounded-full text-[12.5px] font-medium transition"
              style={ tab===id ? { background:"var(--ink)", color:"var(--paper)" } : { border:"1px solid var(--rule)", color:"var(--ink-soft)" } }>
              {label}
            </button>
          ))}
        </div>
        <div className="space-y-3 max-h-[480px] overflow-y-auto scrollthin pr-1">
          {filtered.length===0 && <div className="text-sm text-center py-8" style={{ color:"var(--ink-soft)" }}>Nothing here.</div>}
          {filtered.map((g,i)=>(
            <div key={g.id} className="rounded-xl p-4" style={{ border:"1px solid var(--rule)" }}>
              <div className="flex items-center gap-2 mb-2 flex-wrap text-[11px]" style={{ color:"var(--ink-soft)" }}>
                <span className="font-semibold" style={{ color:"var(--ink)" }}>Q{g.number}</span>
                <span>· {g.subject}</span><span>· {g.year}</span>
                {g.answered ? (
                  g.correct ? <span className="px-2 py-0.5 rounded-full" style={{ background:"var(--correct-soft)", color:"var(--correct)" }}>Correct</span>
                  : <span className="px-2 py-0.5 rounded-full" style={{ background:"var(--wrong-soft)", color:"var(--wrong)" }}>Incorrect</span>
                ) : <span className="px-2 py-0.5 rounded-full" style={{ background:"var(--paper)" }}>Unanswered</span>}
              </div>
              {g.passage && (
                <div className="rounded-lg p-3 mb-2 text-[12.5px] leading-relaxed" style={{ background:"var(--paper)", color:"var(--ink-soft)" }}>
                  <MathText text={g.passage} />
                </div>
              )}
              <PageImageViewer question={g} bank={state.bank} />
              <div className="text-sm mb-2 serif"><MathText text={g.questionText} /></div>
              <div className="text-xs space-y-1">
                <div style={{ color:"var(--ink-soft)" }}>Your answer: <span className="font-medium" style={{ color: g.answered ? (g.correct?"var(--correct)":"var(--wrong)") : "var(--ink-soft)" }}>{g.selected ? `${g.selected}. ${g.options.find(o=>o.label===g.selected)?.text||""}` : "—"}</span></div>
                {!g.correct && <div style={{ color:"var(--ink-soft)" }}>Correct answer: <span className="font-medium" style={{ color:"var(--correct)" }}>{g.correctOption}. {g.options.find(o=>o.label===g.correctOption)?.text}</span></div>}
              </div>
              {g.explanation && (
                <details className="mt-2">
                  <summary className="text-xs font-medium cursor-pointer" style={{ color:"var(--gold)" }}>Explanation</summary>
                  <div className="text-xs mt-1.5" style={{ color:"var(--ink-soft)" }}><MathText text={g.explanation} /></div>
                </details>
              )}
            </div>
          ))}
        </div>
      </div>

      <div className="flex flex-col sm:flex-row gap-2.5 mt-6">
        <button onClick={retake} className="sm:flex-1 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 whitespace-nowrap" style={{ background:"var(--ink)", color:"var(--paper)" }}>
          <Icon name="repeat" size={14} /> Retake test
        </button>
        <button onClick={newConfig} className="sm:flex-1 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 whitespace-nowrap" style={{ border:"1px solid var(--rule)" }}>
          <Icon name="sliders-horizontal" size={14} /> Configure new test
        </button>
        <button onClick={newUpload} className="sm:flex-1 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 whitespace-nowrap" style={{ border:"1px solid var(--rule)" }}>
          <Icon name="upload" size={14} /> Upload another PDF
        </button>
      </div>
    </div>
  );
}

/* ============================== APP ============================== */

function App(){
  const [state, setState] = useState(()=> {
    const loaded = loadState() || defaultState();
    // Migrate any model name from an older version of this app that a
    // provider has since retired, so a stale save never silently fails.
    const RETIRED_MODELS = { "gemini-1.5-flash":"gemini-3.6-flash", "gemini-1.5-pro":"gemini-3.6-flash", "gemini-2.5-flash":"gemini-3.6-flash", "gemini-2.5-pro":"gemini-3.6-flash" };
    if(RETIRED_MODELS[loaded.model]) loaded.model = RETIRED_MODELS[loaded.model];
    return loaded;
  });
  const [showSettings, setShowSettings] = useState(false);
  const [showResume, setShowResume] = useState(false);
  const [lastResult, setLastResult] = useState(null);
  const [autosaveTick, setAutosaveTick] = useState(false);
  const { toasts, push } = useToasts();
  const initialized = useRef(false);

  // apply theme on mount
  useEffect(()=>{
    const theme = state.theme === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
  }, []);

  // resume detection on first mount
  useEffect(()=>{
    if(!initialized.current){
      initialized.current = true;
      if(state.activeTest && state.activeTest.status === "IN_PROGRESS"){
        setShowResume(true);
      }
    }
  }, []);

  // If another tab/window of this app saves newer papers, pick them up
  // here live — without this, a stale tab that's still open can later
  // save over that newer data with what it still has in memory.
  useEffect(()=>{
    function onStorage(e){
      if(e.key !== STORAGE_KEY || !e.newValue) return;
      try{
        const fresh = JSON.parse(e.newValue);
        if(Array.isArray(fresh.savedBanks)){
          setState(s => {
            const byId = new Map();
            [...(s.savedBanks||[]), ...fresh.savedBanks].forEach(entry => { if(entry && entry.id) byId.set(entry.id, entry); });
            const merged = trimSavedBanksBySize([...byId.values()]);
            return { ...s, savedBanks: merged };
          });
        }
      }catch(err){ /* ignore malformed cross-tab payloads */ }
    }
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, []);

  // persist on every change (real-time autosave)
  useEffect(()=>{
    saveState(state);
    setAutosaveTick(t=>!t);
  }, [state]);

  const finishTest = useCallback(()=>{
    setState(s=>{
      const t = s.activeTest;
      if(!t) return s;
      const elapsedTotal = t.mode === "exam" ? (t.config.timerMins*60 - t.remainingSeconds) : t.elapsedSeconds;
      const graded = t.questions.filter(q=>q.correctOption===t.answers[q.id]).length;
      const historyEntry = {
        id: t.id, date: Date.now(), mode: t.mode, total: t.questions.length, correct: graded,
        pct: t.questions.length ? Math.round(graded/t.questions.length*100) : 0,
        subjects: t.config.subjects, years: t.config.years, timeTaken: elapsedTotal
      };
      setLastResult({ questions: t.questions, answers: t.answers, flagged: t.flagged, mode: t.mode, config: t.config, elapsedTotal });
      return { ...s, activeTest: null, history: [historyEntry, ...s.history].slice(0,50) };
    });
  }, []);

  const resume = () => setShowResume(false);
  const discard = () => { setState(s=>({ ...s, activeTest: null })); setShowResume(false); };

  let screen;
  if(state.activeTest && state.activeTest.status === "IN_PROGRESS" && !showResume){
    screen = <ExamScreen state={state} setState={setState} push={push} onFinish={finishTest} />;
  } else if(!state.activeTest && lastResult){
    screen = <ResultsScreen state={state} setState={setState} result={lastResult} push={push} onExit={()=>setLastResult(null)} />;
  } else if(!showResume && state.bank){
    screen = <ConfiguratorScreen state={state} setState={setState} push={push} />;
  } else if(!showResume){
    screen = <UploadScreen state={state} setState={setState} push={push} />;
  } else {
    screen = <div className="max-w-2xl mx-auto px-5 py-24" />;
  }

  return (
    <div className="min-h-screen">
      <Header state={state} setState={setState} onOpenSettings={()=>setShowSettings(true)} autosaveTick={autosaveTick} />
      {screen}
      {showSettings && <SettingsModal state={state} setState={setState} onClose={()=>setShowSettings(false)} push={push} />}
      {showResume && state.activeTest && (
        <ResumeModal activeTest={state.activeTest} onResume={resume} onDiscard={discard} />
      )}
      <ToastStack toasts={toasts} />
      <footer className="max-w-6xl mx-auto px-5 py-10 text-center text-[11px]" style={{ color:"var(--ink-soft)" }}>
        {APP_NAME} runs entirely in your browser — your PDF and API key never leave this device except to reach your chosen AI provider.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- Manually compile + run the app script above, in OUR OWN script context
     (not Babel's), so that any error thrown gets full, unmasked detail
     instead of being hidden as a cross-origin "Script error." -->
<script>
  (function(){
    function boot(){
      try{
        var src = document.getElementById("app-source").textContent;
        if(typeof Babel === "undefined") throw new Error("Babel did not load — cannot compile the app.");
        var compiled = Babel.transform(src, { presets: ["react"] }).code;
        (0, eval)(compiled);
      }catch(err){
        showFatal("The app code failed to compile or run.", (err && err.message) + (err && err.stack ? ("\n\n" + err.stack) : ""));
      }
    }
    if(document.readyState === "complete" || document.readyState === "interactive"){
      setTimeout(boot, 0);
    }else{
      document.addEventListener("DOMContentLoaded", boot);
    }
  })();
</script>
</body>
