<script>
  // Surface any crash instead of leaving a blank page.
  function showFatal(label, detail){
    var root = document.getElementById("root");
    if(root) root.innerHTML =
      '<div style="font-family:sans-serif;max-width:560px;margin:40px auto;padding:20px;border:1px solid #e0a;border-radius:10px;color:#7a1f1f;background:#fff3f3;white-space:pre-wrap;word-break:break-word;">' +
      '<strong>OmniCBT failed to load.</strong><br/><br/>' +
      label + '<br/><br/>' +
      (detail || '') +
      '</div>' + (window.__diagnosticsHTML ? window.__diagnosticsHTML() : '');
  }
  window.addEventListener("error", function(e){
    var detail = 'Error: ' + (e.message || "unknown") +
      (e.filename ? ('\nat ' + e.filename + ':' + e.lineno + ':' + e.colno) : '') +
      (e.error && e.error.stack ? ('\n\n' + e.error.stack) : '');
    showFatal('A script threw an error.', detail);
  });
  window.addEventListener("unhandledrejection", function(e){
    var reason = e.reason;
    var detail = 'Unhandled promise rejection: ' + (reason && (reason.message || reason.toString ? reason.toString() : reason));
    if(reason && reason.stack) detail += '\n\n' + reason.stack;
    showFatal('A background task failed.', detail);
  });

  // Diagnostics: report exactly which external resource(s) failed to load,
  // and if nothing has failed but the app still hasn't booted after a few
  // seconds, dump the full load status so we know where it's stuck.
  var REQUIRED = ["react","react-dom","babel","lucide","tailwind","pdfjs","katex","katex-auto"];
  window.__diagnosticsHTML = function(){
    var rows = REQUIRED.map(function(id){
      var st = window.__loadStatus[id] || "pending / never fired";
      return '<div><strong>' + id + '</strong>: ' + st + '</div>';
    }).join("");
    return '<div style="font-family:sans-serif;max-width:560px;margin:16px auto;padding:16px;border:1px solid #ccc;border-radius:10px;font-size:13px;color:#333;background:#fafafa;">' +
      '<strong>Resource load status</strong><br/><br/>' + rows + '</div>';
  };
  window.__renderDiagnostics = function(){
    var anyFail = REQUIRED.some(function(id){ return window.__loadStatus[id] && window.__loadStatus[id].indexOf("FAILED") === 0; });
    if(anyFail) showFatal("One or more required scripts failed to load — see below for exactly which one:", "");
  };
  setTimeout(function(){
    var root = document.getElementById("root");
    // If React never mounted (root still holds only our placeholder), report status.
    if(root && root.textContent.indexOf("Loading OmniCBT") !== -1){
      showFatal("The app never finished starting up (timed out after 8s).", "");
    }
  }, 8000);
</script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================== CONSTANTS ============================== */

const STORAGE_KEY = "omnicbt_state_v1";
const APP_NAME = "OmniCBT";

const SYSTEM_PROMPT = `Extract every multiple-choice question from the past-question text below into this JSON schema:
{
  "title": "Document Title",
  "availableSubjects": ["Subject1", "Subject2"],
  "availableYears": ["2020", "2021"],
  "questions": [
    {
      "id": "q1",
      "year": "2021",
      "subject": "Physics",
      "section": "Section A",
      "passage": "Shared reading passage, comprehension text, or the full sentence containing an underlined word this question depends on — omit if self-contained.",
      "questionText": "Question text (math as LaTeX, e.g. $E=mc^2$)",
      "options": [{"label": "A", "text": "Option 1"}, {"label": "B", "text": "Option 2"}],
      "correctOption": "A",
      "explanation": "Step-by-step answer explanation.",
      "hasDiagram": false
    }
  ]
}
Rules:
- Ignore watermarks, "download more at ...", site URLs, and page numbers entirely — they are not questions and must never appear in your output. If an answer key exists, use it to determine correctOption; otherwise solve each question yourself.
- LaTeX formatting: every "$" you open MUST have a matching closing "$" — never leave one unclosed. Wrap ONLY the actual symbol/expression in "$...$" (e.g. "$x^2$", "$\theta$", "$\frac{3}{4}$") — never wrap a full sentence or explanatory prose inside "$...$", and never mix plain English words inside math delimiters. In "explanation" especially, keep math and prose clearly separate: short math spans in "$...$", ordinary sentences outside them.
- The source is often two-column: pages were reordered left-column-top-to-bottom then right-column-top-to-bottom before reaching you, but that reordering can still be imperfect. Use each question's own printed number as the source of truth for grouping its text and options together and for detecting any leftover misordering — never merge two different question numbers' content, and never invent a question number that doesn't appear in the text.
- A question must be understandable on its own: if it depends on a passage, an underlined word, or "the diagram below", copy that context into "passage" (text) or set "hasDiagram": true (a genuine visual figure/graph/circuit/picture only — never for comprehension or lexis-and-structure, those are text, always false for those).
- Keep subject and year names clean and identical every time this document is read in (e.g. always "English Language", never "ENGLISH LANGUAGE" sometimes and "English Language" other times) — you are only seeing one small slice of a larger document, and inconsistent naming across slices fragments one real subject into several.
- A page can contain the tail of one subject/year followed by a new heading followed by the next one's start — split at the real boundary, don't label a whole page with one heading.
- If a heading doesn't repeat on this slice, infer subject/year from context (topic, terminology, numbering continuing from before) rather than leaving it blank. If genuinely undeterminable, use exactly "Unknown" (never "Not Specified"/"N/A"/similar).
- Output ONLY the JSON object — no markdown fences, no commentary.`;

const SAMPLE_BANK = {
  title: "Sample Past Questions — General Science (2019–2021)",
  availableSubjects: ["Physics", "Chemistry", "Biology", "Mathematics"],
  availableYears: ["2019", "2020", "2021"],
  questions: [
    { id:"q1", year:"2021", subject:"Physics", section:"Section A", questionText:"A body of mass 2 kg moves with a velocity of 3 m/s. What is its kinetic energy?", options:[{label:"A",text:"6 J"},{label:"B",text:"9 J"},{label:"C",text:"18 J"},{label:"D",text:"36 J"}], correctOption:"B", explanation:"KE = $\\frac{1}{2}mv^2$ = $\\frac{1}{2}(2)(3)^2$ = 9 J." },
    { id:"q2", year:"2021", subject:"Physics", section:"Section A", questionText:"The SI unit of electric current is the", options:[{label:"A",text:"Volt"},{label:"B",text:"Ohm"},{label:"C",text:"Ampere"},{label:"D",text:"Coulomb"}], correctOption:"C", explanation:"Electric current is measured in Amperes (A), named after André-Marie Ampère." },
    { id:"q3", year:"2020", subject:"Chemistry", section:"Section A", questionText:"Which of the following is a noble gas?", options:[{label:"A",text:"Nitrogen"},{label:"B",text:"Neon"},{label:"C",text:"Chlorine"},{label:"D",text:"Oxygen"}], correctOption:"B", explanation:"Neon (Ne) belongs to Group 18, the noble gases, which have full valence shells." },
    { id:"q4", year:"2020", subject:"Chemistry", section:"Section B", questionText:"What is the pH of a neutral solution at 25°C?", options:[{label:"A",text:"0"},{label:"B",text:"7"},{label:"C",text:"14"},{label:"D",text:"1"}], correctOption:"B", explanation:"A neutral solution has equal H+ and OH- concentrations, giving pH = 7 at 25°C." },
    { id:"q5", year:"2019", subject:"Biology", section:"Section A", questionText:"The powerhouse of the cell is the", options:[{label:"A",text:"Nucleus"},{label:"B",text:"Ribosome"},{label:"C",text:"Mitochondrion"},{label:"D",text:"Golgi body"}], correctOption:"C", explanation:"Mitochondria generate ATP through cellular respiration, earning the nickname 'powerhouse of the cell'." },
    { id:"q6", year:"2019", subject:"Biology", section:"Section A", questionText:"Which blood vessel carries oxygenated blood away from the heart?", options:[{label:"A",text:"Vena cava"},{label:"B",text:"Pulmonary vein"},{label:"C",text:"Aorta"},{label:"D",text:"Pulmonary artery"}], correctOption:"C", explanation:"The aorta is the main artery carrying oxygenated blood from the left ventricle to the body." },
    { id:"q7", year:"2021", subject:"Mathematics", section:"Section A", questionText:"Solve for $x$: $2x + 5 = 17$", options:[{label:"A",text:"5"},{label:"B",text:"6"},{label:"C",text:"7"},{label:"D",text:"8"}], correctOption:"B", explanation:"$2x = 17-5 = 12$, so $x = 6$." },
    { id:"q8", year:"2020", subject:"Mathematics", section:"Section A", questionText:"What is the derivative of $x^3$ with respect to $x$?", options:[{label:"A",text:"$x^2$"},{label:"B",text:"$3x$"},{label:"C",text:"$3x^2$"},{label:"D",text:"$3x^3$"}], correctOption:"C", explanation:"Using the power rule, $\\frac{d}{dx}x^3 = 3x^2$." },
    { id:"q9", year:"2019", subject:"Physics", section:"Section B", questionText:"Sound cannot travel through", options:[{label:"A",text:"Water"},{label:"B",text:"Vacuum"},{label:"C",text:"Steel"},{label:"D",text:"Air"}], correctOption:"B", explanation:"Sound is a mechanical wave and requires a medium; it cannot travel through a vacuum." },
    { id:"q10", year:"2020", subject:"Biology", section:"Section B", questionText:"Photosynthesis mainly occurs in which part of the plant cell?", options:[{label:"A",text:"Mitochondria"},{label:"B",text:"Chloroplast"},{label:"C",text:"Nucleus"},{label:"D",text:"Vacuole"}], correctOption:"B", explanation:"Chloroplasts contain chlorophyll, which captures light energy for photosynthesis." },
    { id:"q11", year:"2021", subject:"Chemistry", section:"Section B", questionText:"The process of a liquid changing directly to a gas at the surface is called", options:[{label:"A",text:"Boiling"},{label:"B",text:"Evaporation"},{label:"C",text:"Condensation"},{label:"D",text:"Sublimation"}], correctOption:"B", explanation:"Evaporation happens at the surface of a liquid below its boiling point." },
    { id:"q12", year:"2019", subject:"Mathematics", section:"Section B", questionText:"What is the value of $\\sin(90°)$?", options:[{label:"A",text:"0"},{label:"B",text:"0.5"},{label:"C",text:"1"},{label:"D",text:"-1"}], correctOption:"C", explanation:"$\\sin(90°) = 1$, the maximum value of the sine function." }
  ]
};

/* ============================== PERSISTENCE ============================== */

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ console.error("Failed to load state", e); return null; }
}
function saveState(state){
  // Multiple tabs/sessions of this app can be open against the same
  // browser storage. Blindly overwriting with whatever's in THIS tab's
  // memory means a stale tab (still holding an older extraction) can
  // silently wipe out a newer one saved elsewhere — "last write wins,"
  // even when last isn't newest. Merge savedBanks with whatever's
  // already persisted instead of replacing it outright, so a stale
  // write can never destroy a paper another session already saved.
  let toSave = state;
  try{
    const existingRaw = localStorage.getItem(STORAGE_KEY);
    if(existingRaw){
      const existing = JSON.parse(existingRaw);
      if(Array.isArray(existing.savedBanks) && Array.isArray(state.savedBanks)){
        const byId = new Map();
        [...existing.savedBanks, ...state.savedBanks].forEach(entry => { if(entry && entry.id) byId.set(entry.id, entry); });
        const merged = trimSavedBanksBySize([...byId.values()]);
        toSave = { ...state, savedBanks: merged };
      }
    }
  }catch(e){ /* fall back to a plain overwrite below if merge fails */ }

  // The browser's real, hard storage limit can be stricter than our own
  // soft 4MB budget above (this varies by device and is out of our
  // control). A save must never be all-or-nothing: if the full write is
  // rejected, that must NOT take the current session — the active bank,
  // an in-progress test — down with it just because history didn't fit.
  // Retry with progressively less history, oldest first, before giving up.
  let banks = Array.isArray(toSave.savedBanks) ? toSave.savedBanks.slice() : [];
  for(let attempt = 0; attempt <= banks.length; attempt++){
    const attemptState = { ...toSave, savedBanks: banks };
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(attemptState));
      return true;
    }catch(e){
      if(banks.length === 0){
        console.error("Failed to save state even with no saved-paper history kept:", e);
        return false;
      }
      banks = banks.slice(0, -1); // drop the oldest (list is newest-first) and retry
    }
  }
  return false;
}
function defaultState(){
  return {
    apiKey: "", provider:"openai", model: "gpt-4o-mini",
    pagesPerRequest: 2, slowMode: false, sendPageImages: false,
    theme: "light",
    bank: null,
    savedBanks: [],
    history: [],
    activeTest: null
  };
}

/* Keep a library of already-extracted papers so a PDF never has to be
   re-read from scratch. There's no arbitrary count limit — the real
   constraint is how much a browser will actually let one site store
   (a few MB, typically), so trimming is based on real size, not a made-up
   number. The newest paper is always kept even if it alone were somehow
   over budget; only older ones get dropped, and only once the total
   genuinely gets close to that limit. */
const SAVED_BANKS_BUDGET_BYTES = 2 * 1024 * 1024;
function trimSavedBanksBySize(banks, maxBytes = SAVED_BANKS_BUDGET_BYTES){
  const sorted = [...(banks || [])].sort((a,b) => (b.savedAt||0) - (a.savedAt||0));
  const kept = [];
  let size = 0;
  for(const entry of sorted){
    let entrySize = 0;
    try{ entrySize = new Blob([JSON.stringify(entry)]).size; }catch(e){ entrySize = JSON.stringify(entry).length; }
    if(size + entrySize > maxBytes && kept.length > 0) break;
    kept.push(entry);
    size += entrySize;
  }
  return kept;
}
function saveBankToHistory(savedBanks, bank, sourceName){
  const entry = {
    id: uid(),
    savedAt: Date.now(),
    sourceName: sourceName || "Untitled PDF",
    bank
  };
  return trimSavedBanksBySize([entry, ...(savedBanks || [])]);
}
function timeAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if(s < 60) return "just now";
  const m = Math.floor(s/60); if(m < 60) return `${m}m ago`;
  const h = Math.floor(m/60); if(h < 24) return `${h}h ago`;
  const d = Math.floor(h/24); if(d < 30) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
}

/* ============================== HELPERS ============================== */

function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n => String(n).padStart(2,"0");
  return h>0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function gradeFor(pct){
  if(pct>=70) return {label:"A", tone:"var(--correct)"};
  if(pct>=60) return {label:"B", tone:"var(--correct)"};
  if(pct>=50) return {label:"C", tone:"var(--gold)"};
  if(pct>=45) return {label:"D", tone:"var(--gold)"};
  if(pct>=40) return {label:"E", tone:"var(--wrong)"};
  return {label:"F", tone:"var(--wrong)"};
}
function filterQuestions(bank, subjects, years){
  if(!bank) return [];
  return bank.questions.filter(q=>{
    const sOk = subjects.includes("All") || subjects.includes(q.subject);
    const yOk = years.includes("All") || years.includes(q.year);
    return sOk && yOk;
  });
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* A model-written explanation occasionally has malformed LaTeX: either a
   "$...$" span that swallows a long run of plain prose (KaTeX then renders
   the whole thing as "math", silently dropping every space in it — LaTeX
   ignores whitespace outside explicit spacing commands — so a full sentence
   reads as one squished-together word and can blow out the page layout),
   or a "$" that opens but never closes (KaTeX can't find the pair, so it
   gives up and shows the raw LaTeX source — literal backslash-theta,
   caret-2, etc. — instead of rendering anything). Both get repaired here,
   at render time, so this fixes already-saved question banks too, not just
   future ones. */
function latexToPlain(str){
  const superscripts = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻","+":"⁺"};
  return str
    .replace(/\\left|\\right/g, "")
    .replace(/\\theta/g, "θ").replace(/\\pi/g, "π").replace(/\\alpha/g, "α").replace(/\\beta/g, "β")
    .replace(/\\gamma/g, "γ").replace(/\\delta/g, "δ").replace(/\\lambda/g, "λ").replace(/\\mu/g, "μ")
    .replace(/\\sin/g, "sin").replace(/\\cos/g, "cos").replace(/\\tan/g, "tan").replace(/\\log/g, "log").replace(/\\ln/g, "ln")
    .replace(/\\sqrt\{([^}]*)\}/g, "√($1)")
    .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "($1)/($2)")
    .replace(/\\times/g, "×").replace(/\\div/g, "÷").replace(/\\pm/g, "±")
    .replace(/\\leq/g, "≤").replace(/\\geq/g, "≥").replace(/\\neq/g, "≠").replace(/\\approx/g, "≈")
    .replace(/\^\{?(-?[0-9]+)\}?/g, (m,p1) => p1.split("").map(c=>superscripts[c]||c).join(""))
    .replace(/[{}\\]/g, "");
}
function sanitizeMathText(text){
  if(!text || typeof text !== "string") return text;
  const dollarCount = (text.match(/\$/g) || []).length;
  if(dollarCount % 2 !== 0){
    return latexToPlain(text.replace(/\$/g, ""));
  }
  const looksLikeMath = (s) => {
    if(s.length > 120) return false;
    const wordyTokens = s.trim().split(/\s+/).filter(w => /^[a-zA-Z]{3,}$/.test(w) && !/^(sin|cos|tan|log|ln|sqrt)$/i.test(w)).length;
    return wordyTokens <= 6;
  };
  return text
    .replace(/\$\$([\s\S]*?)\$\$/g, (m, inner) => looksLikeMath(inner) ? m : latexToPlain(inner))
    .replace(/\$([^$]*?)\$/g, (m, inner) => looksLikeMath(inner) ? m : latexToPlain(inner));
}

/* Render text possibly containing $...$ / $$...$$ LaTeX using KaTeX auto-render */
function MathText({ text, className }){
  const ref = useRef(null);
  const safeText = sanitizeMathText(text);
  useEffect(()=>{
    if(ref.current && window.renderMathInElement){
      try{
        window.renderMathInElement(ref.current, {
          delimiters:[
            {left:"$$", right:"$$", display:true},
            {left:"$", right:"$", display:false}
          ],
          throwOnError:false
        });
      }catch(e){}
    }
  }, [safeText]);
  return <span ref={ref} className={`${className||""} break-words`}>{safeText}</span>;
}

/* Shows the original scanned page(s) a question came from, collapsed by
   default — this is how a diagram, figure, or hand-drawn equation actually
   gets seen, since the extracted text alone has no way to represent one. */
function PageImageViewer({ question, bank }){
  const [open, setOpen] = useState(false);
  if(!question.hasDiagram) return null;
  const pageNums = question.sourcePages || [];
  const images = pageNums.map(n => bank?.pageThumbs?.[n]).filter(Boolean);
  if(images.length === 0) return null;
  return (
    <div className="mb-5">
      <button onClick={()=>setOpen(v=>!v)}
        className="text-xs font-semibold flex items-center gap-1.5 px-3 py-1.5 rounded-full transition hover:opacity-80"
        style={{ border:"1px solid var(--rule)", color:"var(--ink-soft)" }}>
        <Icon name="image" size={13} />
        {open ? "Hide diagram" : "View diagram"}
      </button>
      {open && (
        <div className="mt-3 space-y-2 rounded-xl p-2 scrollthin overflow-x-auto flex gap-2" style={{ border:"1px solid var(--rule)", background:"var(--paper)" }}>
          {images.map((src,i)=>(
            <img key={i} src={src} alt={`Original page ${pageNums[i]}`} className="rounded-lg max-h-[420px] shrink-0" style={{ border:"1px solid var(--rule)" }} />
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================== ICONS ============================== */
function Icon({ name, size=18, className="", strokeWidth=2 }){
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current && window.lucide && window.lucide.createElement){
      ref.current.innerHTML = "";
      // Lucide's UMD build has exposed icons under different key casings across
      // versions (kebab-case, PascalCase). Try every reasonable form instead of
      // assuming one, so an icon never silently fails to render.
      const iconsMap = window.lucide.icons || {};
      const pascal = name.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("");
      const camel = pascal.charAt(0).toLowerCase() + pascal.slice(1);
      let def = iconsMap[name] || iconsMap[pascal] || window.lucide[pascal] || window.lucide[camel] || window.lucide[name];
      if(!def){
        // Last resort: scan all keys and match case-insensitively / ignoring dashes.
        const target = name.replace(/-/g, "").toLowerCase();
        const pool = Object.keys(iconsMap).length ? iconsMap : window.lucide;
        const foundKey = Object.keys(pool).find(k => k.replace(/-/g, "").toLowerCase() === target);
        if(foundKey) def = pool[foundKey];
      }
      if(def){
        const svg = window.lucide.createElement(def);
        svg.setAttribute("width", size); svg.setAttribute("height", size);
        svg.setAttribute("stroke-width", strokeWidth);
        ref.current.appendChild(svg);
      }
    }
  }, [name, size, strokeWidth]);
  return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{lineHeight:0}} />;
}

/* ============================== TOAST ============================== */
function useToasts(){

    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), opts.duration || 2200);

}
function ToastStack({ toasts }){

/* ============================== AI CALL ============================== */
/* Text-only by default — proven both faster and more accurate in testing.
   sendImages is an explicit opt-in for documents that genuinely need it. */

async function callOpenAI({ apiKey, model, pages, sendImages }){
  const content = [
    { type:"text", text: "Extract all questions from the following past-question page(s) into the JSON schema described in the system prompt:\n\n" + pages.map(p=>`--- Page ${p.pageNumber} ---\n${p.text}`).join("\n\n") }
  ];
  if(sendImages) pages.forEach(p => { if(p.image) content.push({ type:"image_url", image_url:{ url: p.image } }); });
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${apiKey}` },
    body: JSON.stringify({
      model: model || "gpt-4o-mini",
      response_format: { type:"json_object" },
      messages:[
        { role:"system", content: SYSTEM_PROMPT },
        { role:"user", content }
      ],
      max_tokens: 16000
    })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> "");
    const err = new Error(`OpenAI API error (${res.status}): ${errText.slice(0,300)}`);
    err.status = res.status;
    err.retryAfter = res.headers.get("retry-after");
    throw err;
  }
  const data = await res.json();
  // A model that runs low on its own output budget can wrap up cleanly with
  // valid-but-incomplete JSON instead of erroring — invisible unless we
  // check for it explicitly. OpenAI flags this via finish_reason.
  if(data?.choices?.[0]?.finish_reason === "length"){
    throw new Error("Response was cut off before finishing (ran out of output space) — try a smaller \"pages read at once\" setting.");
  }
  const text = data?.choices?.[0]?.message?.content;
  if(!text) throw new Error("No content returned from OpenAI.");
  return text;
}

async function callGemini({ apiKey, model, pages, sendImages }){
  const m = model || "gemini-3.6-flash";
  const parts = [
    { text: SYSTEM_PROMPT + "\n\nPage text:\n\n" + pages.map(p=>`--- Page ${p.pageNumber} ---\n${p.text}`).join("\n\n") }
  ];
  if(sendImages) pages.forEach(p => { if(p.image) parts.push({ inline_data: { mime_type: "image/jpeg", data: p.image.split(",")[1] } }); });
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      contents:[{ role:"user", parts }],
      generationConfig:{ response_mime_type:"application/json", maxOutputTokens: 16000 }
    })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> "");
    const err = new Error(`Gemini API error (${res.status}): ${errText.slice(0,300)}`);
    err.status = res.status;
    err.retryAfter = res.headers.get("retry-after");
    throw err;
  }
  const data = await res.json();
  // Same silent-truncation risk as OpenAI — Gemini flags it via
  // finishReason on the candidate instead of failing outright.
  if(data?.candidates?.[0]?.finishReason === "MAX_TOKENS"){
    throw new Error("Response was cut off before finishing (ran out of output space) — try a smaller \"pages read at once\" setting.");
  }
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text).join("");
  if(!text) throw new Error("No content returned from Gemini.");
  return text;
}

async function callAnthropic({ apiKey, model, pages }){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({
      model: model || "claude-sonnet-4-6",
      max_tokens: 16000,
      system: SYSTEM_PROMPT,
      messages:[
        { role:"user", content: "Extract all questions from the following past-question page(s) into the JSON schema described in the system prompt:\n\n" + pages.map(p=>`--- Page ${p.pageNumber} ---\n${p.text}`).join("\n\n") }
      ]
    })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> "");
    const err = new Error(`Claude API error (${res.status}): ${errText.slice(0,300)}`);
    err.status = res.status;
    err.retryAfter = res.headers.get("retry-after");
    throw err;
  }

  if(data?.stop_reason === "max_tokens"){

  return text;
}

/* Ask the provider what models actually exist right now, instead of us
   guessing a hardcoded name that they might rename or retire at any time. */
async function fetchAvailableModels(provider, apiKey){
  if(provider === "openai"){
    const res = await fetch("https://api.openai.com/v1/models", {
      headers:{ "Authorization":`Bearer ${apiKey}` }
    });
    if(!res.ok) throw new Error(`Couldn't list OpenAI models (${res.status}).`);
    const data = await res.json();
    const exclude = ["audio","realtime","transcribe","tts","embedding","moderation","instruct","image","search","dall-e","whisper","davinci","babbage"];
    return (data.data || [])
      .map(m => m.id)
      .filter(id => (id.startsWith("gpt-") || id.startsWith("o1") || id.startsWith("o3") || id.startsWith("o4")))
      .filter(id => !exclude.some(x => id.includes(x)))
      .sort();
  }else if(provider === "anthropic"){
    const res = await fetch("https://api.anthropic.com/v1/models", {
      headers:{ "x-api-key": apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" }
    });
    if(!res.ok) throw new Error(`Couldn't list Claude models (${res.status}).`);
    const data = await res.json();
    return (data.data || []).map(m => m.id).sort();
  }else{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
    if(!res.ok) throw new Error(`Couldn't list Gemini models (${res.status}).`);
    const data = await res.json();
    return (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes("generateContent") && m.name.includes("gemini"))
      .map(m => m.name.replace(/^models\//, ""))
      .sort();
  }
}

function parseExtractedJSON(raw){
  let cleaned = raw.trim();
  cleaned = cleaned.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  const firstBrace = cleaned.indexOf("{");
  const lastBrace = cleaned.lastIndexOf("}");
  if(firstBrace >= 0 && lastBrace > firstBrace) cleaned = cleaned.slice(firstBrace, lastBrace+1);
  const parsed = JSON.parse(cleaned);
  if(!parsed.questions || !Array.isArray(parsed.questions)) throw new Error("Malformed response: missing questions array.");
  parsed.questions = parsed.questions.map((q,i)=>({ id: q.id || `q${i+1}`, ...q }));
  if(!parsed.availableSubjects) parsed.availableSubjects = [...new Set(parsed.questions.map(q=>q.subject).filter(Boolean))];
  if(!parsed.availableYears) parsed.availableYears = [...new Set(parsed.questions.map(q=>q.year).filter(Boolean))];
  return parsed;
}

/* Combine the results read from each group of pages into one single
   question bank, and renumber question ids so nothing collides.
   Different page-groups are read independently, so the same subject often
   comes back spelled differently ("ENGLISH LANGUAGE" vs "English Language")
   — collapse those into one canonical label instead of showing near-
   duplicate subjects. */
function titleCase(str){
  return str.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
}
const UNKNOWN_PLACEHOLDERS = new Set(["unknown","not specified","unspecified","n/a","na","none","not given","not stated","undetermined","tbd","?"]);
function normalizeYear(raw){
  const clean = (raw || "Unknown").toString().trim();
  return UNKNOWN_PLACEHOLDERS.has(clean.toLowerCase()) ? "Unknown" : clean;
}
function mergeBanks(banks){
  const title = banks.find(b=>b.title)?.title || "Extracted question bank";

  const canonicalSubjects = new Map(); // normalized key -> display label
  const canonicalize = (raw) => {
    const clean = (raw || "General").toString().trim().replace(/\s+/g, " ");
    const key = clean.toLowerCase();
    if(!canonicalSubjects.has(key)) canonicalSubjects.set(key, titleCase(clean));
    return canonicalSubjects.get(key);
  };

  const questions = banks.flatMap(b=>b.questions).map((q,i)=>({
    ...q,
    id: `q${i+1}`,
    subject: canonicalize(q.subject),
    year: normalizeYear(q.year)
  }));

  const availableSubjects = [...new Set(questions.map(q=>q.subject))].sort();
  const availableYears = [...new Set(questions.map(q=>q.year))].sort();
  return { title, availableSubjects, availableYears, questions };
}

function chunk(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i, i+size));
  return out;
}

/* Run several async jobs at once (instead of one after another), capped at
   `limit` in flight at a time, so a 79-page PDF isn't waiting on 20 network
   round-trips in a strict single-file line. `onSettle` fires as each job
   finishes (in whatever order it happens to complete) so progress can update
   live rather than only at the very end. */
async function runPool(items, limit, worker, onSettle){
  const results = new Array(items.length);
  let nextIndex = 0;
  let doneCount = 0;
  async function runner(){
    while(nextIndex < items.length){
      const i = nextIndex++;
      try{
        results[i] = { ok:true, value: await worker(items[i], i) };
      }catch(e){
        results[i] = { ok:false, error:e };
      }
      doneCount++;
      onSettle && onSettle(doneCount, items.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, runner));
  return results;
}

/* Retry a flaky call before giving up. Rate-limit errors (429) get a real
   wait — often several seconds, using whatever the provider itself says to
   wait — since retrying instantly just hits the same wall again. Anything
   else gets a short pause, since it's more likely a one-off glitch. */
async function withRetry(fn, { retries = 2, baseDelayMs = 1500 } = {}){
  let lastErr;
  for(let attempt=0; attempt <= retries; attempt++){
    try{ return await fn(); }
    catch(e){
      lastErr = e;
      if(attempt < retries){
        const isRateLimit = e.status === 429;
        const serverWait = Number(e.retryAfter) * 1000;
        const wait = isRateLimit
          ? (serverWait > 0 ? serverWait : baseDelayMs * Math.pow(2, attempt + 1))
          : baseDelayMs;
        await new Promise(r => setTimeout(r, wait));
      }
    }
  }
  throw lastErr;
}

/* pdf.js hands back text items in whatever order they sit in the PDF's raw
   content stream — for a two-column exam layout, that's often literally
   "left-column question 1, then right-column question 10, then left-column
   question 2..." interleaved. Naively joining that scrambles the numbering
   the AI is trying to read (and is almost certainly why some questions were
   getting dropped in text-only mode). This buckets items into a left/right
   column by their actual x position, then reads each column top-to-bottom
   on its own, which is what a person actually does with a two-column page. */
function readingOrderText(textContent, pageWidth){
  const items = (textContent.items || [])
    .filter(it => it.str && it.str.trim())
    .map(it => ({ str: it.str, x: it.transform ? it.transform[4] : 0, y: it.transform ? it.transform[5] : 0 }));
  if(items.length === 0) return "";
  const mid = pageWidth / 2;
  const left = items.filter(it => it.x < mid);
  const right = items.filter(it => it.x >= mid);
  // If almost everything is on one side, this isn't really a two-column
  // page — just read it as one column in its natural top-to-bottom order.
  if(left.length < items.length * 0.15 || right.length < items.length * 0.15){
    return cleanExtractedText(items.slice().sort((a,b) => (b.y - a.y) || (a.x - b.x)).map(it=>it.str).join(" "));
  }
  const readTopToBottom = (arr) => arr.slice().sort((a,b) => (b.y - a.y) || (a.x - b.x)).map(it=>it.str).join(" ");
  return cleanExtractedText([readTopToBottom(left), readTopToBottom(right)].filter(Boolean).join(" "));
}

/* Word/MathType-generated PDFs (very common source for these compiled
   past-question documents) often embed a hidden duplicate copy of an
   equation's text right next to the visible one — e.g. the page literally
   contains "log102=0.3010log102=0.3010" for one expression. Left in, this
   garbles math/physics/chemistry content specifically (while plain text
   subjects like English stay clean), confuses the AI, and was very likely
   why entire subjects were failing to extract. This strips the invisible
   markup characters that cause the two copies to not quite byte-match, then
   collapses any exact run that repeats itself back-to-back. */
function cleanExtractedText(text){
  if(!text) return text;
  let cleaned = text.replace(/[\u00AD\u200B\u200C\u200D\u2060\u2061\u2062\u2063\u2064\uFEFF]/g, "");
  cleaned = cleaned.replace(/(.{3,120}?)\1+/g, "$1");
  return cleaned;
}

/* Render PDF pages to base64 JPEG images (and extract their text) using pdf.js.
   Skips the (slow) canvas rendering entirely when images won't be sent anyway. */
/* Fast pass: read every page's text only. No canvas rendering at all, which
   is what made a long document slow before — this is now the only thing
   that runs for the whole document, regardless of length. Keeps the pdf.js
   document open (`pdf`) so specific pages can be rendered later, on demand,
   without re-parsing the file from scratch. */
async function loadPdfPagesText(file, onProgress, maxPages = 200, renderImages = false){
  const arrayBuffer = await file.arrayBuffer();
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const total = Math.min(pdf.numPages, maxPages);
  const pages = [];
  for(let i=1;i<=total;i++){
    const page = await pdf.getPage(i);
    let text = "";
    try{
      const textContent = await page.getTextContent();
      const baseViewport = page.getViewport({ scale: 1 });
      text = readingOrderText(textContent, baseViewport.width);
    }catch(e){ /* best-effort */ }
    let image = null;
    if(renderImages){
      // Optional, off by default: renders and sends a full picture of every
      // page to the AI instead of just its text. Kept available because some
      // documents genuinely need it, but this is the slow, expensive path —
      // text-only has consistently proven both faster and more accurate for
      // typical typed past-question PDFs.
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      image = canvas.toDataURL("image/jpeg", 0.75);
    }
    pages.push({ pageNumber: i, text, image });
    onProgress && onProgress(i, total);
  }
  return { pdf, pages };
}

/* Targeted pass: render just ONE page, only called afterward for the small
   number of pages a question actually flagged as needing a real diagram —
   never the whole document, and never a page that looks like it's just an
   answer key. */
async function renderPageThumb(pdf, pageNumber){
  const page = await pdf.getPage(pageNumber);
  const viewport = page.getViewport({ scale: 1.4 });
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  const thumbScale = Math.min(1, 700 / canvas.width);
  const thumbCanvas = document.createElement("canvas");
  thumbCanvas.width = Math.round(canvas.width * thumbScale);
  thumbCanvas.height = Math.round(canvas.height * thumbScale);
  thumbCanvas.getContext("2d").drawImage(canvas, 0, 0, thumbCanvas.width, thumbCanvas.height);
  return thumbCanvas.toDataURL("image/jpeg", 0.55);
}

/* Never show a page that's really just an answer key/marking scheme — a
   diagram-flagged question can end up sharing a page-group with one of
   these, and the raw page must never leak into what the student sees. */
function looksLikeAnswerKeyPage(text){
  const flat = (text || "").toLowerCase();
  if(/\bsolution(s)?\s+to\b|\banswer\s*key\b|\bmarking\s*scheme\b|\bcorrect\s*answers?\b\s*[:\-]/i.test(flat)) return true;
  // A long run of "12. B 13. A 14. D ..." with no real question wording is
  // an answer list, not question content.
  const hits = flat.match(/\b\d{1,3}\s*[.)]\s*[a-e]\b/gi) || [];
  return hits.length >= 8;
}

/* A page whose text contains a section banner — e.g. "PHYSICS 1983" or
   "Mathematics 2001" — almost always means a new subject/year is starting
   somewhere on it. Recognizing this lets extraction start a fresh request
   right at that boundary instead of blindly cutting every N pages.
   Real past-question PDFs almost always carry a repeating watermark or
   running header ("Uploaded on www.example.com", a page number, etc.)
   BEFORE the actual heading on every single page — so this scans a wide
   window of the page's text rather than assuming the heading is the very
   first thing on it. */
const KNOWN_SUBJECTS = [
  "Mathematics","Further Mathematics","English Language","Use of English","Physics","Chemistry","Biology",
  "Economics","Government","Geography","Literature in English","Literature","Accounting","Commerce",
  "Agricultural Science","Christian Religious Studies","Islamic Religious Studies","History","Civic Education",
  "Computer Studies","Insurance","Bookkeeping","Music","Fine Art","French","Hausa","Igbo","Yoruba",
  "Technical Drawing","Home Economics","Food and Nutrition"
];
function looksLikeSectionHeading(pageText){
  const text = (pageText || "").replace(/\s+/g, " ").trim();
  const escaped = KNOWN_SUBJECTS.map(s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  // A known subject name immediately followed by a year is such a specific,
  // low-risk pattern that it's safe to search the ENTIRE page for it — the
  // heading can turn up anywhere, including well past a page's first few
  // hundred characters (leftover questions from the previous section,
  // watermarks, etc. can all come before it).
  const knownSubject = new RegExp(`\\b(${escaped.join("|")})\\b\\s+(19|20)\\d{2}\\b`, "i");
  if(knownSubject.test(text)) return true;
  // Fallback for a subject we don't have listed: a short capitalized phrase
  // immediately followed by a 4-digit year. Less specific, so this one stays
  // windowed to the early part of the page to keep false positives rare.
  const generic = /\b[A-Z][a-zA-Z]+(?:\s+[A-Z][a-zA-Z]+){0,3}\s+(19|20)\d{2}\b/;
  return generic.test(text.slice(0, 600));
}

/* Group pages for reading: start a new group right at a detected section
   heading (keeping it together with the questions that follow it), and
   otherwise fall back to a plain page-count cap so no single request ever
   gets too large. */
function smartChunk(pages, targetSize){
  const groups = [];
  let current = [];
  for(let i=0;i<pages.length;i++){
    const p = pages[i];
    const isNewSection = current.length > 0 && looksLikeSectionHeading(p.text);
    if(isNewSection || current.length >= targetSize){
      groups.push(current);
      current = [];
    }
    current.push(p);
  }
  if(current.length) groups.push(current);
  return groups;
}

/* ============================== HEADER ============================== */

function Header({ state, setState, onOpenSettings, autosaveTick }){
  const apiReady = !!state.apiKey;
  const toggleTheme = () => {
    const next = state.theme === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    setState(s=>({ ...s, theme: next }));
  };
  return (
    <header className="sticky top-0 z-40 border-b rule" style={{ background:"var(--paper)" }}>
      <div className="max-w-6xl mx-auto px-5 py-3.5 flex items-center justify-between gap-3">
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-lg flex items-center justify-center serif font-bold text-[17px]" style={{ background:"var(--gold)", color:"#fff" }}>
            Ω
          </div>
          <div className="serif font-bold text-[17px] leading-none tracking-tight">{APP_NAME}</div>
        </div>

        <div className="flex items-center gap-2">
          {state.activeTest && state.activeTest.status === "IN_PROGRESS" && (
            <div className="hidden sm:flex items-center gap-1.5 text-[11px] px-2.5 py-1.5 rounded-full" style={{ color:"var(--ink-soft)", border:"1px solid var(--rule)" }}>
              <Icon name={autosaveTick ? "cloud-check" : "cloud"} size={12} />
              Auto-Save Enabled
            </div>
          )}
          <button onClick={toggleTheme} className="w-8 h-8 rounded-full flex items-center justify-center hover:opacity-70 transition" style={{ border:"1px solid var(--rule)" }} aria-label="Toggle theme">
            <Icon name={state.theme === "dark" ? "sun" : "moon"} size={14} />
          </button>
          <button onClick={onOpenSettings}
            className="flex items-center gap-1.5 text-[12px] font-semibold px-3 py-1.5 rounded-full transition hover:opacity-85"
            style={{ background: apiReady ? "var(--correct-soft)" : "var(--wrong-soft)", color: apiReady ? "var(--correct)" : "var(--wrong)" }}>
            <Icon name={apiReady ? "shield-check" : "shield-alert"} size={12} />
            {apiReady ? "API Ready" : "Set API Key"}
          </button>
        </div>
      </div>
    </header>
  );
}

  const [provider, setProvider] = useState(state.provider);
  // If a model saved from an older version of this app (e.g. a retired
  // Gemini model name) is no longer in our list, quietly fall back to the
  // first valid option instead of carrying a broken value forward.
  const [model, setModel] = useState(
    modelsFor(state.provider).includes(state.model) ? state.model : modelsFor(state.provider)[0]

  const [showHelp, setShowHelp] = useState(false);

/* ============================== SCREEN 2: UPLOAD ============================== */

function UploadScreen({ state, setState, push }){
  const [dragOver, setDragOver] = useState(false);
  const [processing, setProcessing] = useState(false);
  const [stage, setStage] = useState("");
  const [error, setError] = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const inputRef = useRef(null);

  const startExtraction = async (file) => {
    if(!state.apiKey){ setError("Add your API key first (top right) — it's needed to read the PDF."); return; }
    setError(""); setProcessing(true);
    try{
      const sendImages = !!state.sendPageImages;
      setStage("Reading PDF pages...");
      const { pdf, pages } = await loadPdfPagesText(file, (i,total)=> setStage(`Reading page ${i} of ${total}...`), 200, sendImages);
      const groupSize = Math.max(1, Number(state.pagesPerRequest) || 2);
      // Start a fresh request right at a detected "PHYSICS 1983"-style
      // section banner instead of blindly cutting every N pages — that was
      // exactly what could split a heading away from its own questions and
      // leave them mislabeled "Unknown".
      const groups = smartChunk(pages, groupSize);
      const skipped = [];

      // Free API keys have real, fairly tight per-minute limits — reading
      // several page-groups at once can blow straight through them. "Go
      // easy" mode reads one group at a time with real waits between
      // retries; otherwise a modest amount of overlap.
      const CONCURRENCY = state.slowMode ? 1 : 3;
      const settled = await runPool(groups, CONCURRENCY, async (group) => {
        return withRetry(async () => {
          const raw = state.provider === "openai"
            ? await callOpenAI({ apiKey: state.apiKey, model: state.model, pages: group, sendImages })
            : state.provider === "anthropic"
            ? await callAnthropic({ apiKey: state.apiKey, model: state.model, pages: group })
            : await callGemini({ apiKey: state.apiKey, model: state.model, pages: group, sendImages });
          const parsed = parseExtractedJSON(raw);
          // Tag every question with the real page numbers it came from —
          // driven by our own grouping, not something we have to trust the
          // AI to report accurately — so the original page can be found
          // again later if (and only if) it's actually needed.
          const sourcePages = group.map(p => p.pageNumber);
          parsed.questions = parsed.questions.map(q => ({ ...q, sourcePages }));
          return parsed;
        }, { retries: 3, baseDelayMs: state.slowMode ? 3000 : 1500 });
      }, (done, total) => {
        setStage(total > 1 ? `Reading questions (${done} of ${total} parts done)...` : "Reading questions...");
      });

      const results = [];
      settled.forEach((s, g) => {
        if(s.ok){ results.push(s.value); }
        else{
          console.error(`Pages ${groups[g][0].pageNumber}-${groups[g][groups[g].length-1].pageNumber} failed:`, s.error);
          const pageRange = groups[g].length > 1
            ? `pages ${groups[g][0].pageNumber}–${groups[g][groups[g].length-1].pageNumber}`
            : `page ${groups[g][0].pageNumber}`;
          skipped.push({ range: pageRange, message: s.error?.message || "unknown problem" });
        }
      });

      if(results.length === 0){
        throw new Error(`Couldn't read any pages successfully. First problem: ${skipped[0]?.message || "unknown"}`);
      }
      setStage("Sorting questions by subject and year...");
      const bank = mergeBanks(results);

      // Second, much smaller pass: only now, only for questions that were
      // actually flagged as depending on a real diagram, go back and render
      // just those specific pages — never the whole document, and never a
      // page that reads like an answer key rather than a question.
      const diagramPages = new Set();
      bank.questions.forEach(q => {
        if(q.hasDiagram && q.sourcePages){
          q.sourcePages.forEach(pn => {
            const pageInfo = pages.find(p => p.pageNumber === pn);
            if(pageInfo && !looksLikeAnswerKeyPage(pageInfo.text)) diagramPages.add(pn);
          });
        }
      });
      const pageThumbs = {};
      if(diagramPages.size > 0){
        setStage(`Capturing ${diagramPages.size} diagram${diagramPages.size>1?"s":""}...`);
        const pageList = [...diagramPages];
        await runPool(pageList, 3, async (pn) => {
          try{ pageThumbs[pn] = await renderPageThumb(pdf, pn); }catch(e){ console.error(`Couldn't render page ${pn}`, e); }
        });
      }
      bank.pageThumbs = pageThumbs;

      setState(s=>({ ...s, bank, savedBanks: saveBankToHistory(s.savedBanks, bank, file.name) }));
      if(skipped.length > 0){
        // Show the real reason, not just which pages — a vague "had
        // trouble" was useless for actually diagnosing what went wrong, and
        // a toast that vanishes in a few seconds isn't much better. Once
        // more than a third of the document failed, this is very unlikely
        // to be "a few bad pages" — put the real error(s) on screen
        // permanently instead of hoping it gets caught in time.
        const failRate = skipped.length / groups.length;
        const uniqueMessages = [...new Set(skipped.map(s2 => s2.message))];
        if(failRate > 0.3){
          const detail = uniqueMessages.slice(0,3).map((m,i)=>`${i+1}. ${m}`).join("\n");
          setError(`${skipped.length} of ${groups.length} parts failed (${bank.questions.length} question${bank.questions.length===1?"":"s"} recovered from the rest). This is a systemic problem, not a few bad pages — the real error(s) seen:\n\n${detail}`);
        }else{
          push(`Found ${bank.questions.length} questions — ${skipped.length} of ${groups.length} parts failed: ${uniqueMessages[0]}`, { tone:"save", duration: 7000 });
        }
      }else{
        push(`Found ${bank.questions.length} questions`, { tone:"save" });
      }
    }catch(e){
      console.error(e);
      setError(e.message || "Extraction failed. Check your API key and try again.");
    }finally{
      setProcessing(false); setStage("");
    }
  };

  const onFile = (file) => {
    if(!file) return;

function ChipMultiSelect({ options, selected, onChange, icon }){
  const toggle = (opt) => {
    if(opt === "All"){ onChange(["All"]); return; }
    let next = selected.includes("All") ? [] : [...selected];
    if(next.includes(opt)) next = next.filter(x=>x!==opt); else next = [...next, opt];
    if(next.length === 0) next = ["All"];
    onChange(next);
  };
  return (
    <div className="flex flex-wrap gap-1.5">
      {["All", ...options].map(opt=>{
        const active = selected.includes(opt);
        return (
          <button key={opt} onClick={()=>toggle(opt)}
            className="px-3 py-1.5 rounded-full text-[12.5px] font-medium transition flex items-center gap-1.5"
            style={ active ? { background:"var(--ink)", color:"var(--paper)" } : { border:"1px solid var(--rule)", color:"var(--ink-soft)" } }>
            {icon && <Icon name={icon} size={11} />}
            {opt}
          </button>
        );
      })}
    </div>
  );
}

    const chosen = shuffle(matched).slice(0, count);

        <div className="grid grid-cols-3 gap-3 mt-5">

            <div key={label} className="rounded-xl px-4 py-3 text-center" style={{ background:"var(--paper)" }}>
              <div className="serif text-2xl font-semibold">{val}</div>
              <div className="text-[11px] mt-0.5" style={{ color:"var(--ink-soft)" }}>{label}</div>

          ))}

      <div className="card rounded-2xl p-6 space-y-6">

        <div>
          <div className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color:"var(--ink-soft)" }}>Mode</div>
          <div className="grid grid-cols-2 gap-2.5">
            {[
              { id:"exam", title:"Exam mode", desc:"Timed, palette navigation, results at the end", icon:"timer" },

              <button key={m.id} onClick={()=>setMode(m.id)}
                className="text-left rounded-xl p-4 transition"

                <div className="flex items-center gap-2 font-semibold text-sm"><Icon name={m.icon} size={15} />{m.title}</div>

          </div>
          <input type="range" min={maxCount>0?1:0} max={Math.max(1,maxCount)} value={Math.min(count,Math.max(1,maxCount))}

            {[5,10,20,50].filter(n=>n<=maxCount).map(n=>(
